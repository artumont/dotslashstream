name: dotslashstream

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - .:/src
      - go-cache:/go/pkg/mod
    environment:
      PORT: 8080
      DB_DSN: postgres://postgres:postgres@database:5432/dotslashstream?sslmode=disable
      REDIS_ADDRESS: redis:6379
      BUCKET_ADDRESS: minio:9000
      BUCKET_KEY_ID: minioadmin
      BUCKET_ACCESS_KEY: minioadmin
      HMAC_SECRET: dev-secret-change-in-production
      USE_SSL: "false"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  database:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dotslashstream
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal

volumes:
  pg-data:
  go-cache:

networks:
  internal:
    driver: bridge
